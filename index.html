<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fuel Indent</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<!-- Firebase SDK -->
<script type="module">
import { initializeApp }   from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
import { getFirestore, collection, doc,
         addDoc, getDocs, deleteDoc,
         setDoc, onSnapshot, orderBy,
         query, getDoc }   from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey:            "AIzaSyBlQdjirQmA0oDBoALyeaKswMj2pfSdGYI",
  authDomain:        "fuel-indent.firebaseapp.com",
  projectId:         "fuel-indent",
  storageBucket:     "fuel-indent.firebasestorage.app",
  messagingSenderId: "707992681541",
  appId:             "1:707992681541:web:b29bb30d4bfe2e831cf72c"
};

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);

window._db = {
  async addRecord(data)      { await addDoc(collection(db, 'fi_records'), data); },
  async clearRecords()       { const s = await getDocs(collection(db,'fi_records')); await Promise.all(s.docs.map(d=>deleteDoc(d.ref))); },
  async saveSettings(co)     { await setDoc(doc(db,'fi_settings','data'), { companies: co }); },
  async saveCounter(n)       { await setDoc(doc(db,'fi_counter','data'), { value: n }); },
  async getCounter()         { const s = await getDoc(doc(db,'fi_counter','data')); return s.exists() ? (s.data().value||1) : 1; },
  listenRecords(cb)          { return onSnapshot(query(collection(db,'fi_records'), orderBy('ts','asc')), s => cb(s.docs.map(d=>({_id:d.id,...d.data()})))); },
  listenSettings(cb)         { return onSnapshot(doc(db,'fi_settings','data'), s => { if(s.exists()) cb(s.data()); }); }
};
window._dbReady = true;
window.dispatchEvent(new Event('dbReady'));
</script>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; font-size: 13px; background: #e8e8e8; padding: 12px; }

/* LOGIN */
#loginScreen { position: fixed; inset: 0; background: #222; display: flex; align-items: center; justify-content: center; z-index: 999; }
#loginScreen.hidden { display: none; }
.login-box { background: #fff; border: 1px solid #aaa; padding: 32px 28px; width: 300px; max-width: 92%; text-align: center; }
.login-box h2 { font-size: 15px; font-weight: bold; text-transform: uppercase; margin-bottom: 4px; }
.login-box p  { font-size: 11px; color: #777; margin-bottom: 20px; }
.login-box input[type="password"] { width: 100%; padding: 9px 10px; font-size: 15px; border: 1px solid #bbb; margin-bottom: 8px; letter-spacing: 6px; text-align: center; }
.login-box input[type="password"]:focus { outline: 2px solid #333; }
.login-box button { width: 100%; padding: 10px; font-size: 14px; font-weight: bold; background: #222; color: #fff; border: none; cursor: pointer; }
.login-box button:hover { background: #444; }
.login-box .lerr { color: #c00; font-size: 11px; min-height: 16px; margin-bottom: 6px; }

/* TABS */
.tabs { display: flex; gap: 4px; margin-bottom: 12px; }
.tab { padding: 7px 18px; border: 1px solid #999; background: #ddd; cursor: pointer; font-size: 13px; font-weight: bold; user-select: none; }
.tab.active { background: #fff; border-bottom: 1px solid #fff; position: relative; top: 1px; }
.page { display: none; }
.page.active { display: block; }

/* CARD */
.card { background: #fff; border: 1px solid #bbb; padding: 14px; max-width: 480px; margin: 0 auto 14px auto; }
.card h3 { font-size: 13px; font-weight: bold; border-bottom: 1px solid #ccc; padding-bottom: 6px; margin-bottom: 10px; text-transform: uppercase; }

/* FIELDS */
.field { margin-bottom: 9px; }
.field label { display: block; font-size: 11px; font-weight: bold; text-transform: uppercase; color: #555; margin-bottom: 3px; }
.field select { width: 100%; padding: 6px 8px; font-size: 13px; border: 1px solid #bbb; }
.field select:focus { outline: 2px solid #333; }
.row2 { display: flex; gap: 8px; }
.row2 .field { flex: 1; }
.auto-val { background: #f4f4f4; border: 1px solid #ccc; padding: 6px 8px; font-size: 13px; font-weight: bold; min-height: 30px; color: #111; }

/* STATUS */
.status-bar { max-width: 480px; margin: 0 auto 8px auto; padding: 6px 10px; font-size: 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; background: #fff3cd; border: 1px solid #ffc107; }
.status-bar.ok  { background: #d4edda; border-color: #28a745; }
.status-bar.err { background: #f8d7da; border-color: #dc3545; }

.err { color: #c00; font-size: 11px; margin-top: 5px; min-height: 16px; }

/* BUTTONS */
.btn-row { display: flex; gap: 8px; margin-top: 10px; }
button { flex: 1; padding: 8px; font-size: 13px; font-weight: bold; border: 1px solid #555; background: #fff; cursor: pointer; }
button:hover { background: #eee; }
.btn-dark  { background: #222; color: #fff; border-color: #222; }
.btn-dark:hover  { background: #444; }
.btn-green { background: #1a6630; color: #fff; border-color: #1a6630; }
.btn-green:hover { background: #0f4a22; }
.btn-red   { background: #a00; color: #fff; border-color: #a00; }
.btn-red:hover   { background: #c00; }

/* RECORDS */
.records-card { background: #fff; border: 1px solid #bbb; padding: 14px; max-width: 1000px; margin: 0 auto; }
.rec-hdr { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; flex-wrap: wrap; gap: 8px; }
.rec-hdr h3 { font-size: 13px; font-weight: bold; text-transform: uppercase; }
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
th { background: #333; color: #fff; padding: 6px 8px; text-align: left; font-size: 11px; white-space: nowrap; }
td { padding: 5px 8px; border-bottom: 1px solid #e0e0e0; white-space: nowrap; }
tr:hover td { background: #f9f9f9; }
.empty { text-align: center; padding: 20px; color: #999; }

/* SETTINGS */
.settings-card { background: #fff; border: 1px solid #bbb; padding: 14px; max-width: 540px; margin: 0 auto 14px auto; }
.settings-card h3 { font-size: 13px; font-weight: bold; border-bottom: 1px solid #ccc; padding-bottom: 6px; margin-bottom: 10px; text-transform: uppercase; }
.list-editor { display: flex; flex-direction: column; gap: 5px; margin-bottom: 6px; }
.list-item { display: flex; gap: 6px; align-items: center; }
.list-item input { flex: 1; padding: 4px 6px; font-size: 12px; border: 1px solid #bbb; }
.list-item button { flex: none; padding: 4px 8px; font-size: 12px; background: #eee; border: 1px solid #bbb; color: #a00; font-weight: bold; cursor: pointer; }
.list-item button:hover { background: #fdd; }
.add-btn { font-size: 12px; padding: 4px 10px; background: #eee; border: 1px solid #bbb; cursor: pointer; font-weight: bold; margin-top: 2px; }
.add-btn:hover { background: #ddd; }
.co-name-input { width: 100%; padding: 5px 7px; font-size: 13px; border: 1px solid #bbb; margin-bottom: 8px; font-weight: bold; }

/* MODAL */
.modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100; align-items: center; justify-content: center; }
.modal-bg.show { display: flex; }
.modal { background: #fff; border: 1px solid #aaa; padding: 22px 24px; width: 280px; max-width: 90%; }
.modal h4 { font-size: 13px; font-weight: bold; margin-bottom: 12px; text-transform: uppercase; }
.modal input[type="password"] { width: 100%; padding: 7px 9px; font-size: 14px; border: 1px solid #bbb; margin-bottom: 6px; letter-spacing: 4px; }
.modal input[type="password"]:focus { outline: 2px solid #333; }
.modal .merr { color: #c00; font-size: 11px; min-height: 16px; margin-bottom: 6px; }
.modal .mbtn-row { display: flex; gap: 8px; }

/* PRINT — 58mm thermal */
#printArea { display: none; }
@media print {
  body > *:not(#printArea) { display: none !important; }
  #printArea {
    display: block !important;
    width: 52mm;
    font-family: 'Courier New', Courier, monospace;
    font-size: 11pt;
    color: #000;
    padding: 2mm 2mm;
  }
  @page { size: 58mm auto; margin: 0; }
  .p-center { text-align: center; }
  .p-big    { font-size: 14pt; font-weight: bold; letter-spacing: 1px; }
  .p-sm     { font-size: 9pt; }
  .p-line   { border-top: 1px dashed #000; margin: 4px 0; }
  .p-dbl    { border-top: 2.5px solid #000; margin: 4px 0; }
  .p-block  { margin: 5px 0 7px 0; line-height: 1.4; }
  .p-lbl    { font-size: 9pt; color: #333; }
  .p-val    { font-weight: bold; font-size: 12pt; word-break: break-word; white-space: normal; }
  .p-amount { text-align: center; font-size: 13pt; font-weight: bold; margin: 6px 0; }
  .p-gap    { height: 5mm; }
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-box">
    <h2>⛽ Fuel Indent</h2>
    <p>Deepthi Traders &amp; Kalmargi Hardwares</p>
    <input type="password" id="loginPw" placeholder="Password" maxlength="10"
           onkeydown="if(event.key==='Enter') doLogin()">
    <div class="lerr" id="loginErr"></div>
    <button onclick="doLogin()">Login</button>
  </div>
</div>

<!-- ADMIN MODAL -->
<div class="modal-bg" id="pwModal">
  <div class="modal">
    <h4 id="pwTitle">Admin Access</h4>
    <input type="password" id="pwInput" placeholder="Password" maxlength="20"
           onkeydown="if(event.key==='Enter') pwSubmit()">
    <div class="merr" id="pwErr"></div>
    <div class="mbtn-row">
      <button onclick="pwCancel()">Cancel</button>
      <button class="btn-dark" onclick="pwSubmit()">OK</button>
    </div>
  </div>
</div>

<!-- DB STATUS -->
<div class="status-bar" id="dbStatus">⏳ Connecting to database…</div>

<!-- TABS -->
<div class="tabs">
  <div class="tab active" onclick="showTab('indent')">New Indent</div>
  <div class="tab"        onclick="showTab('records')">Records</div>
  <div class="tab"        onclick="requireAdmin('settings')">Settings 🔒</div>
</div>

<!-- ══ INDENT FORM ══ -->
<div id="page-indent" class="page active">
  <div class="card">
    <h3>Fuel Indent</h3>

    <div class="field">
      <label>Company</label>
      <select id="fCompany" onchange="onCompanyChange()">
        <option value="">-- Select Company --</option>
      </select>
    </div>

    <div class="row2">
      <div class="field">
        <label>Indent No.</label>
        <div class="auto-val" id="dispIndentNo">—</div>
      </div>
      <div class="field">
        <label>Date</label>
        <div class="auto-val" id="dispDate">—</div>
      </div>
    </div>

    <div class="field">
      <label>Driver Name</label>
      <select id="fDriver" disabled>
        <option value="">-- Select Company First --</option>
      </select>
    </div>

    <div class="field">
      <label>Vehicle Number</label>
      <select id="fVehicle" disabled>
        <option value="">-- Select Company First --</option>
      </select>
    </div>

    <div class="field">
      <label>Petrol Bunk / Station</label>
      <select id="fStation" disabled>
        <option value="">-- Select Company First --</option>
      </select>
    </div>

    <div class="row2">
      <div class="field">
        <label>Fuel Type</label>
        <select id="fFuel" disabled>
          <option value="">-- Select --</option>
          <option value="Petrol">Petrol</option>
          <option value="Diesel">Diesel</option>
          <option value="CNG">CNG</option>
        </select>
      </div>
      <div class="field">
        <label>Authorized By</label>
        <select id="fAuth" disabled>
          <option value="">-- Select Company First --</option>
        </select>
      </div>
    </div>

    <div class="err" id="errMsg"></div>

    <div class="btn-row">
      <button onclick="resetForm()">Clear</button>
      <button class="btn-dark" onclick="generateIndent()">Print Indent</button>
    </div>
  </div>
</div>

<!-- ══ RECORDS ══ -->
<div id="page-records" class="page">
  <div class="records-card">
    <div class="rec-hdr">
      <h3>Indent Records</h3>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
        <span id="recCount" style="font-size:11px;color:#666;">0 records</span>
        <button class="btn-red"   style="flex:none;padding:5px 12px;font-size:12px;" onclick="requireAdmin('clearRecords')">Clear All 🔒</button>
        <button class="btn-green" style="flex:none;padding:5px 12px;font-size:12px;" onclick="exportExcel()">Export Excel</button>
      </div>
    </div>
    <div class="tbl-wrap">
      <table>
        <thead>
          <tr>
            <th>Indent No</th>
            <th>Date</th>
            <th>Company</th>
            <th>Driver</th>
            <th>Vehicle</th>
            <th>Station</th>
            <th>Fuel</th>
            <th>Auth By</th>
          </tr>
        </thead>
        <tbody id="recBody">
          <tr><td colspan="8" class="empty">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- ══ SETTINGS ══ -->
<div id="page-settings" class="page">
  <div id="settingsContainer"></div>
  <div style="max-width:540px;margin:0 auto;">
    <div class="btn-row">
      <button class="btn-dark" onclick="saveSettings()">Save Settings</button>
    </div>
    <div id="settingsMsg" style="color:green;font-size:12px;margin-top:6px;min-height:16px;"></div>
  </div>
</div>

<!-- PRINT AREA -->
<div id="printArea"></div>

<script>
// ── CONFIG ──
const ADMIN_PASS = '0820';
const LOGIN_PASS = '321';

// ── STATE ──
let records   = [];
let counter   = 1;
let companies = [
  {
    name: 'Deepthi Traders',
    drivers: ['VASU'],
    vehicles: ['KA20D 2988','KA20AA 4926','KA20MB 5866 [BRV]'],
    stations: ['ANKUSH FUELS - SBRKTE','NANDI FUELS - YTNTI','ANIKA FUELS - HNSMKI','MAHALASA FUELS - BDKLKTE'],
    authorizers: ['SS','CH','RDN']
  },
  {
    name: 'Kalmargi Hardwares',
    drivers: ['PRAMOD','SACHIN','PRABHAKARA','EESHWARA','KESHAVA','NARAYANA','RAVINDRA'],
    vehicles: ['KA20AC 1177','KA20AA 9785','KA20AB 1110','KA20AA 4108','KA20AA 4828','KA20AB 4234','KA20AB 7926','KA20D 6864','KA20N 8695 [OMNI]','KA20MD 6394 [WAGNR]','KA20HA 9032 [ROYAL]','KA20ER 9010 [SCOOTY]','KA20EG 9615 [GLAMOR]','KA20ER 8952 [SPLENDOR]'],
    stations: ['ANKUSH FUELS - SBRKTE','NANDI FUELS - YTNTI','ANIKA FUELS - HNSMKI','MAHALASA FUELS - BDKLKTE'],
    authorizers: ['SS','CH','RDN']
  }
];
let dbOK = false;

// ── LOGIN ──
function doLogin() {
  const val = document.getElementById('loginPw').value;
  if (val === LOGIN_PASS) {
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('loginPw').value = '';
    setTimeout(() => document.getElementById('fCompany').focus(), 100);
  } else {
    document.getElementById('loginErr').textContent = 'Incorrect password.';
    document.getElementById('loginPw').value = '';
    document.getElementById('loginPw').focus();
  }
}
window.addEventListener('load', () => {
  setLiveDate();
  populateCompanies();
  updateIndentNo();
  setTimeout(() => document.getElementById('loginPw').focus(), 200);
});

// ── FIREBASE ──
async function onDbReady() {
  dbOK = true;
  setStatus('ok', '✅ Connected — records sync across all devices.');
  counter = await window._db.getCounter();
  updateIndentNo();
  window._db.listenRecords(rows => { records = rows; renderTable(); });
  window._db.listenSettings(data => {
    if (data.companies && data.companies.length) {
      companies = data.companies;
      populateCompanies();
      renderSettings();
    }
  });
}
window.addEventListener('dbReady', onDbReady);
setTimeout(() => { if (!dbOK) setStatus('err', '⚠️ Firebase not connected. Records saved locally only.'); }, 5000);

// ── HELPERS ──
function setStatus(type, msg) {
  const el = document.getElementById('dbStatus');
  el.textContent = msg;
  el.className = 'status-bar ' + type;
}
function setLiveDate() {
  const n = new Date();
  const days   = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  document.getElementById('dispDate').textContent =
    days[n.getDay()] + ', ' + n.getDate() + ' ' + months[n.getMonth()] + ' ' + n.getFullYear();
}
function todayISO() {
  const n = new Date();
  return n.getFullYear() + '-' + p2(n.getMonth()+1) + '-' + p2(n.getDate());
}
function p2(n) { return String(n).padStart(2,'0'); }
function updateIndentNo() {
  document.getElementById('dispIndentNo').textContent = 'FI-' + String(counter).padStart(4,'0');
}
function fmtDate(s) {
  if (!s) return '';
  const [y,m,d] = s.split('-');
  return d+'-'+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+m-1]+'-'+y;
}

// ── COMPANY / FORM ──
function populateCompanies() {
  const sel = document.getElementById('fCompany');
  const cur = sel.value;
  sel.innerHTML = '<option value="">-- Select Company --</option>';
  companies.forEach((c,i) => {
    const o = document.createElement('option');
    o.value = i; o.textContent = c.name; sel.appendChild(o);
  });
  if (cur !== '') sel.value = cur;
}

function onCompanyChange() {
  const idx  = document.getElementById('fCompany').value;
  const deps = ['fDriver','fVehicle','fStation','fAuth','fFuel'];
  if (idx === '') {
    deps.forEach(id => {
      const el = document.getElementById(id);
      el.disabled = true;
      el.innerHTML = '<option value="">-- Select Company First --</option>';
    });
    return;
  }
  const c = companies[parseInt(idx)];
  deps.forEach(id => document.getElementById(id).disabled = false);
  fillSel('fDriver',  c.drivers);
  fillSel('fVehicle', c.vehicles);
  fillSel('fStation', c.stations);
  fillSel('fAuth',    c.authorizers);
  document.getElementById('fFuel').value = '';
}

function fillSel(id, items) {
  const s = document.getElementById(id);
  s.innerHTML = '<option value="">-- Select --</option>';
  (items||[]).forEach(v => {
    const o = document.createElement('option');
    o.value = v; o.textContent = v; s.appendChild(o);
  });
}

// ── FORM DATA & VALIDATE ──
function getForm() {
  const ci = document.getElementById('fCompany').value;
  return {
    indentNo : 'FI-' + String(counter).padStart(4,'0'),
    date     : todayISO(),
    ts       : Date.now(),
    company  : ci !== '' ? companies[parseInt(ci)].name : '',
    driver   : document.getElementById('fDriver').value,
    vehicle  : document.getElementById('fVehicle').value,
    station  : document.getElementById('fStation').value,
    fuel     : document.getElementById('fFuel').value,
    auth     : document.getElementById('fAuth').value
  };
}

function validate(d) {
  const e = document.getElementById('errMsg');
  const checks = [
    [!d.company, 'Select a company.'],
    [!d.driver,  'Select driver name.'],
    [!d.vehicle, 'Select vehicle number.'],
    [!d.station, 'Select petrol bunk / station.'],
    [!d.fuel,    'Select fuel type.'],
    [!d.auth,    'Select authorized by.']
  ];
  for (const [fail, msg] of checks) { if (fail) { e.textContent = msg; return false; } }
  e.textContent = ''; return true;
}

// ── PRINT TEMPLATE ──
function buildPrint(d) {
  const blk = (lbl, val) => `
    <div class="p-block">
      <div class="p-lbl">${lbl}</div>
      <div class="p-val">${val}</div>
    </div>`;
  return `
  <div class="p-center p-big">FUEL INDENT</div>
  <div class="p-center p-sm">${d.company}</div>
  <div class="p-dbl"></div>
  ${blk('Indent No', d.indentNo)}
  ${blk('Date', fmtDate(d.date))}
  <div class="p-line"></div>
  ${blk('Driver',  d.driver)}
  ${blk('Vehicle', d.vehicle)}
  ${blk('Station', d.station)}
  ${blk('Fuel',    d.fuel)}
  <div class="p-dbl"></div>
  <div class="p-amount">FULL TANK</div>
  <div class="p-dbl"></div>
  ${blk('Authorized By', d.auth)}
  <div class="p-gap"></div>`;
}

// ── GENERATE & PRINT ──
async function generateIndent() {
  const d = getForm();
  if (!validate(d)) return;
  try {
    if (dbOK) {
      await window._db.addRecord(d);
      counter++;
      await window._db.saveCounter(counter);
    } else {
      records.push(d);
      counter++;
      renderTable();
    }
    updateIndentNo();
  } catch(e) { console.error('Save failed', e); }
  document.getElementById('printArea').innerHTML = buildPrint(d);
  setTimeout(() => window.print(), 200);
}

function resetForm() {
  document.getElementById('fCompany').value = '';
  document.getElementById('errMsg').textContent = '';
  onCompanyChange();
}

// ── RECORDS TABLE ──
function renderTable() {
  const body = document.getElementById('recBody');
  document.getElementById('recCount').textContent = records.length + ' record(s)';
  if (!records.length) {
    body.innerHTML = '<tr><td colspan="8" class="empty">No records yet.</td></tr>';
    return;
  }
  const sorted = [...records].sort((a,b) => (b.ts||0)-(a.ts||0));
  body.innerHTML = sorted.map(r => `
    <tr>
      <td>${r.indentNo}</td>
      <td>${fmtDate(r.date)}</td>
      <td>${r.company}</td>
      <td>${r.driver}</td>
      <td><b>${r.vehicle}</b></td>
      <td>${r.station}</td>
      <td>${r.fuel}</td>
      <td>${r.auth}</td>
    </tr>`).join('');
}

// ── CLEAR RECORDS ──
async function doClearRecords() {
  try {
    if (dbOK) {
      await window._db.clearRecords();
      counter = 1;
      await window._db.saveCounter(1);
    } else {
      records = []; counter = 1; renderTable();
    }
    updateIndentNo();
  } catch(e) { alert('Error: ' + e.message); }
}

// ── EXPORT EXCEL ──
function exportExcel() {
  if (!records.length) { alert('No records to export.'); return; }
  const sorted = [...records].sort((a,b) => (a.ts||0)-(b.ts||0));
  const rows = [
    ['Indent No','Date','Company','Driver','Vehicle','Station','Fuel','Auth By'],
    ...sorted.map(r => [r.indentNo, r.date, r.company, r.driver, r.vehicle, r.station, r.fuel, r.auth])
  ];
  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws['!cols'] = [12,12,22,16,16,28,8,10].map(w=>({wch:w}));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Fuel Indents');
  XLSX.writeFile(wb, 'FuelIndents_' + todayISO() + '.xlsx');
}

// ── SETTINGS ──
function renderSettings() {
  const cont = document.getElementById('settingsContainer');
  if (!document.getElementById('page-settings').classList.contains('active')) return;
  cont.innerHTML = '';
  companies.forEach((c,ci) => {
    const div = document.createElement('div');
    div.className = 'settings-card';
    div.innerHTML = `
      <h3>Company ${ci+1}</h3>
      <input class="co-name-input" id="co_name_${ci}" value="${esc(c.name)}" placeholder="Company Name">
      ${mkEditor(ci,'drivers',    'Drivers')}
      ${mkEditor(ci,'vehicles',   'Vehicle Numbers')}
      ${mkEditor(ci,'stations',   'Petrol Bunks / Stations')}
      ${mkEditor(ci,'authorizers','Authorized By')}`;
    cont.appendChild(div);
  });
}
function mkEditor(ci, key, label) {
  const rows = (companies[ci][key]||[]).map((v,ii) => `
    <div class="list-item">
      <input type="text" value="${esc(v)}" id="li_${ci}_${key}_${ii}">
      <button onclick="removeItem(${ci},'${key}',${ii})">✕</button>
    </div>`).join('');
  return `
    <div style="margin-bottom:10px;">
      <div style="font-size:11px;font-weight:bold;text-transform:uppercase;color:#555;margin-bottom:4px;">${label}</div>
      <div class="list-editor" id="list_${ci}_${key}">${rows}</div>
      <button class="add-btn" onclick="addItem(${ci},'${key}')">+ Add</button>
    </div>`;
}
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
function addItem(ci,key)       { companies[ci][key].push(''); renderSettings(); }
function removeItem(ci,key,ii) { companies[ci][key].splice(ii,1); renderSettings(); }

async function saveSettings() {
  companies.forEach((c,ci) => {
    c.name = (document.getElementById('co_name_'+ci).value||'').trim() || c.name;
    ['drivers','vehicles','stations','authorizers'].forEach(key => {
      c[key] = Array.from(document.getElementById('list_'+ci+'_'+key)
        .querySelectorAll('input[type="text"]'))
        .map(i=>i.value.trim()).filter(v=>v!=='');
    });
  });
  try {
    if (dbOK) await window._db.saveSettings(companies);
    populateCompanies();
    document.getElementById('settingsMsg').textContent = '✓ Settings saved to cloud.';
  } catch(e) {
    document.getElementById('settingsMsg').textContent = '⚠ Save failed: ' + e.message;
  }
  setTimeout(()=>document.getElementById('settingsMsg').textContent='', 3000);
  renderSettings();
}

// ── TABS ──
function showTab(name) {
  const names = ['indent','records','settings'];
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', names[i]===name));
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  if (name === 'records')  renderTable();
  if (name === 'settings') renderSettings();
}

// ── ADMIN MODAL ──
let _pwTarget = null;
function requireAdmin(target) {
  _pwTarget = target;
  document.getElementById('pwTitle').textContent =
    target === 'clearRecords' ? 'Admin: Clear All Records' : 'Admin: Settings';
  document.getElementById('pwInput').value = '';
  document.getElementById('pwErr').textContent = '';
  document.getElementById('pwModal').classList.add('show');
  setTimeout(() => document.getElementById('pwInput').focus(), 120);
}
function pwCancel() {
  document.getElementById('pwModal').classList.remove('show');
  _pwTarget = null;
}
function pwSubmit() {
  const val = document.getElementById('pwInput').value;
  if (val !== ADMIN_PASS) {
    document.getElementById('pwErr').textContent = 'Incorrect password.';
    document.getElementById('pwInput').value = '';
    document.getElementById('pwInput').focus();
    return;
  }
  document.getElementById('pwModal').classList.remove('show');
  const target = _pwTarget;
  _pwTarget = null;
  if (target === 'settings') {
    showTab('settings');
  } else if (target === 'clearRecords') {
    if (confirm('Delete ALL indent records permanently? This cannot be undone.')) {
      doClearRecords();
    }
  }
}
