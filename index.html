<!-- Firebase SDK -->
<script type="module">
import { initializeApp }                            from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
import { getFirestore, collection, doc,
         addDoc, getDocs, deleteDoc,
         setDoc, onSnapshot, orderBy,
         query, getDoc }                            from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBlQdjirQmA0oDBoALyeaKswMj2pfSdGYI",
  authDomain: "fuel-indent.firebaseapp.com",
  projectId: "fuel-indent",
  storageBucket: "fuel-indent.firebasestorage.app",
  messagingSenderId: "707992681541",
  appId: "1:707992681541:web:b29bb30d4bfe2e831cf72c"
};

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);

// ── Collections ──
const RECORDS_COL  = "fi_records";
const SETTINGS_DOC = "fi_settings/data";
const COUNTER_DOC  = "fi_counter/data";

// ── Expose DB helpers to window so non-module code can call them ──
window._db = {
  // Save a new indent record
  async addRecord(data) {
    await addDoc(collection(db, RECORDS_COL), data);
  },
  // Clear all records
  async clearRecords() {
    const snap = await getDocs(collection(db, RECORDS_COL));
    const dels = snap.docs.map(d => deleteDoc(d.ref));
    await Promise.all(dels);
  },
  // Save settings (companies array + counter)
  async saveSettings(companies) {
    await setDoc(doc(db, "fi_settings", "data"), { companies });
  },
  async saveCounter(n) {
    await setDoc(doc(db, "fi_counter", "data"), { value: n });
  },
  async getCounter() {
    const snap = await getDoc(doc(db, "fi_counter", "data"));
    return snap.exists() ? (snap.data().value || 1) : 1;
  },
  // Real-time listener for records
  listenRecords(callback) {
    const q = query(collection(db, RECORDS_COL), orderBy("ts", "asc"));
    return onSnapshot(q, snap => {
      const rows = snap.docs.map(d => ({ _id: d.id, ...d.data() }));
      callback(rows);
    });
  },
  // Real-time listener for settings
  listenSettings(callback) {
    return onSnapshot(doc(db, "fi_settings", "data"), snap => {
      if (snap.exists()) callback(snap.data());
    });
  }
};

window._dbReady = true;
window.dispatchEvent(new Event('dbReady'));
</script>

<script>
// ─────────────────────────────────────────
// CONFIG
// ─────────────────────────────────────────
const ADMIN_PASS = '0820';
const LOGIN_PASS = '321'
const FALLBACK   = { Petrol: 103.07, Diesel: 90.99, CNG: null };
const PROXY      = 'https://api.allorigins.win/get?url=';
const URL_P      = encodeURIComponent('https://www.goodreturns.in/petrol-price-in-mysore.html');
const URL_D      = encodeURIComponent('https://www.goodreturns.in/diesel-price-in-mysore.html');

// ─────────────────────────────────────────
// STATE
// ─────────────────────────────────────────
let IOC        = { ...FALLBACK };
let rateReady  = false;
let records    = [];          // kept in sync by Firestore listener
let counter    = 1;
let companies  = [
         {
    name: 'Deepthi Traders - +91 9980933973',
    drivers: ['VASU'],
    vehicles: ['KA20D 2988','KA20AA 4926','KA20MB 5866 [BRV]'],
    stations: ['ANKUSH FUELS - SBRKTE','NANDI FUELS - YTNTI','ANIKA FUELS - HNSMKI','MAHALASA FUELS - BDKLKTE'],
    authorizers: ['SS','CH','RDN']
  },
  {
    name: 'Kalmargi Hardwares - +91 9980933973',
    drivers: ['PRAMOD','SACHIN','PRABHAKARA','EESHWARA','KESHAVA','NARAYANA','RAVINDRA'],
    vehicles: ['KA20AC 1177','KA20AA 9785','KA20AB 1110','KA20AA 4108','KA20AA 4828','KA20AB 4234','KA20AB 7926','KA20D 6864','KA20N 8695 [OMNI]','KA20MD 6394 [WAGNR]','KA20HA 9032 [ROYAL]','KA20ER 9010 [SCOOTY]','KA20EG 9615 [GLAMOR]','KA20ER 8952 [SPLENDOR]'],
    stations: ['ANKUSH FUELS - SBRKTE','NANDI FUELS - YTNTI','ANIKA FUELS - HNSMKI','MAHALASA FUELS - BDKLKTE'],
    authorizers: ['SS','CH','RDN']
  }
  ];
let dbOK = false;

         // ─────────────────────────────────────────
// LOGIN
// ─────────────────────────────────────────
function doLogin() {
  const val = document.getElementById('loginPw').value;
  if (val === LOGIN_PASS) {
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('loginPw').value = '';
    // focus first field after login
    setTimeout(() => document.getElementById('fCompany').focus(), 100);
  } else {
    document.getElementById('loginErr').textContent = 'Incorrect password.';
    document.getElementById('loginPw').value = '';
    document.getElementById('loginPw').focus();
  }
}
// Show login on load
window.addEventListener('load', () => {
  setTimeout(() => document.getElementById('loginPw').focus(), 200);
});
         
// ─────────────────────────────────────────
// WAIT FOR FIREBASE THEN INIT
// ─────────────────────────────────────────
async function onDbReady() {
  dbOK = true;
  setStatus('ok', '');

  // Load counter
  counter = await window._db.getCounter();
  updateIndentNo();

  // Real-time record listener
  window._db.listenRecords(rows => {
    records = rows;
    renderTable();
  });

  // Real-time settings listener
  window._db.listenSettings(data => {
    if (data.companies && data.companies.length) {
      companies = data.companies;
      populateCompanies();
      renderSettings();
    }
  });
}

window.addEventListener('dbReady', onDbReady);

// Fallback: if Firebase config not filled in
setTimeout(() => {
  if (!dbOK) {
    setStatus('err', '⚠️ Firebase not configured — records saved locally only. See STEP comments in HTML source.');
  }
}, 5000);

// ─────────────────────────────────────────
// INIT (non-db stuff)
// ─────────────────────────────────────────
window.onload = () => {
  setLiveDate();
  populateCompanies();
  updateIndentNo();
  fetchRates();
};

function setStatus(type, msg) {
  const el = document.getElementById('dbStatus');
  el.textContent = msg;
  el.className = 'status-bar ' + (type === 'ok' ? 'ok' : type === 'err' ? 'err' : '');
}

function setLiveDate() {
  const n = new Date();
  const days   = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  document.getElementById('dispDate').textContent =
    days[n.getDay()] + ', ' + n.getDate() + ' ' + months[n.getMonth()] + ' ' + n.getFullYear();
}

function todayISO() {
  const n = new Date();
  return n.getFullYear() + '-' + p2(n.getMonth()+1) + '-' + p2(n.getDate());
}
function p2(n) { return String(n).padStart(2,'0'); }

function updateIndentNo() {
  document.getElementById('dispIndentNo').textContent = 'FI-' + String(counter).padStart(4,'0');
}

// ─────────────────────────────────────────
// LIVE IOC RATE FETCH
// ─────────────────────────────────────────
async function fetchRates() {
  const barEl  = document.getElementById('rateBarTxt');
  const rateEl = document.getElementById('dispRate');
  barEl.textContent = 'Fetching…';
  rateEl.className = 'auto-val muted';
  rateEl.textContent = 'Fetching…';

  try {
    const [rP, rD] = await Promise.all([
      fetch(PROXY + URL_P).then(r => r.json()),
      fetch(PROXY + URL_D).then(r => r.json())
    ]);
    const petrol = extractPrice(rP.contents);
    const diesel = extractPrice(rD.contents);
    if (!petrol || !diesel) throw new Error('parse fail');
    IOC.Petrol = petrol;
    IOC.Diesel = diesel;
    rateReady  = true;
    barEl.textContent = `Petrol ₹${petrol.toFixed(2)}/L   Diesel ₹${diesel.toFixed(2)}/L   (live · IOC Mysuru)`;
    onFuelChange();
  } catch(e) {
    IOC = { ...FALLBACK };
    rateReady = false;
    barEl.textContent = `Petrol ₹${IOC.Petrol.toFixed(2)}/L   Diesel ₹${IOC.Diesel.toFixed(2)}/L   ⚠ fallback`;
    onFuelChange();
  }
}

function extractPrice(html) {
  if (!html) return null;
  const m = html.match(/(?:₹|Rs\.?\s*)(1\d{2}\.\d{1,2})\s*(?:per\s*li|\/li)/i);
  if (m) return parseFloat(m[1]);
  const m2 = html.match(/(1\d{2}\.\d{2})\s*per\s*li/i);
  if (m2) return parseFloat(m2[1]);
  return null;
}

// ─────────────────────────────────────────
// COMPANY / FORM LOGIC
// ─────────────────────────────────────────
function populateCompanies() {
  const sel = document.getElementById('fCompany');
  const cur = sel.value;
  sel.innerHTML = '<option value="">-- Select Company --</option>';
  companies.forEach((c, i) => {
    const o = document.createElement('option');
    o.value = i; o.textContent = c.name; sel.appendChild(o);
  });
  if (cur !== '') sel.value = cur;
}

function onCompanyChange() {
  const idx  = document.getElementById('fCompany').value;
  const deps = ['fDriver','fVehicle','fStation','fAuth','fFuel'];
  if (idx === '') {
    deps.forEach(id => {
      const el = document.getElementById(id);
      el.disabled = true;
      el.innerHTML = '<option value="">-- Select Company First --</option>';
    });
    document.getElementById('dispLitres').textContent = '—';
    updateRateDisplay();
    return;
  }
  const c = companies[parseInt(idx)];
  deps.forEach(id => document.getElementById(id).disabled = false);
  fillSel('fDriver',  c.drivers);
  fillSel('fVehicle', c.vehicles);
  fillSel('fStation', c.stations);
  fillSel('fAuth',    c.authorizers);
  document.getElementById('fFuel').value = '';
  document.getElementById('dispLitres').textContent = '—';
  updateRateDisplay();
}

function fillSel(id, items) {
  const s = document.getElementById(id);
  s.innerHTML = '<option value="">-- Select --</option>';
  (items||[]).forEach(v => {
    const o = document.createElement('option');
    o.value = v; o.textContent = v; s.appendChild(o);
  });
}

function onFuelChange()     { updateRateDisplay(); calcLitres(); }

function updateRateDisplay() {
  const f  = document.getElementById('fFuel').value;
  const el = document.getElementById('dispRate');
  if (!f) {
    el.className  = 'auto-val muted';
    el.textContent = rateReady ? 'Select fuel type' : 'Fetching…';
    return;
  }
  const rate = IOC[f];
  if (!rate) {
    el.className  = 'auto-val err-val';
    el.textContent = 'Rate unavailable for ' + f;
  } else {
    el.className  = 'auto-val';
    el.textContent = '₹' + rate.toFixed(2) + ' / Litre' + (rateReady ? '' : ' (fallback)');
  }
}

function calcLitres() {
  const amt  = parseFloat(document.getElementById('fAmount').value) || 0;
  const f    = document.getElementById('fFuel').value;
  const rate = f ? IOC[f] : 0;
  document.getElementById('dispLitres').textContent =
    (amt > 0 && rate) ? (amt / rate).toFixed(2) + ' L' : '—';
}

// ─────────────────────────────────────────
// GENERATE & PRINT
// ─────────────────────────────────────────
function getForm() {
  const ci   = document.getElementById('fCompany').value;
  const f    = document.getElementById('fFuel').value;
  const amt  = parseFloat(document.getElementById('fAmount').value) || 0;
  const rate = f ? (IOC[f] || 0) : 0;
  return {
    indentNo : 'FI-' + String(counter).padStart(4,'0'),
    date     : todayISO(),
    ts       : Date.now(),
    company  : ci !== '' ? companies[parseInt(ci)].name : '',
    driver   : document.getElementById('fDriver').value,
    vehicle  : document.getElementById('fVehicle').value,
    station  : document.getElementById('fStation').value,
    fuel     : f,
    auth     : document.getElementById('fAuth').value,
    rate, amount: amt,
    litres   : (rate && amt) ? parseFloat((amt / rate).toFixed(2)) : 0
  };
}

function validate(d) {
  const e = document.getElementById('errMsg');
  const checks = [
    [!d.company,  'Select a company.'],
    [!d.driver,   'Select driver name.'],
    [!d.vehicle,  'Select vehicle number.'],
    [!d.station,  'Select petrol bunk / station.'],
    [!d.fuel,     'Select fuel type.'],
    [!d.auth,     'Select authorized by.'],
    [!d.amount,   'Enter amount.'],
    [!d.rate,     'Rate not available for selected fuel.'],
  ];
  for (const [fail, msg] of checks) { if (fail) { e.textContent = msg; return false; } }
  e.textContent = ''; return true;
}

function fmtDate(s) {
  if (!s) return '';
  const [y,m,d] = s.split('-');
  return d+'-'+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+m-1]+'-'+y;
}

function buildPrint(d) {
  const row = (l, v) => `<div class="p-row"><span>${l}</span><span class="p-val">${v}</span></div>`;
  return `
  <div class="p-center p-big">FUEL INDENT</div>
  <div class="p-center p-sm">${d.company}</div>
  <div class="p-dbl"></div>
  ${row('Indent No:', d.indentNo)}
  ${row('Date:', fmtDate(d.date))}
  <div class="p-line"></div>
  ${row('Driver:',  d.driver)}
  ${row('Vehicle:', d.vehicle)}
  ${row('Station:', d.station)}
  ${row('Fuel:',    d.fuel)}
  <div class="p-dbl"></div>
  ${row('AMOUNT:', '&#x20B9;' + d.amount.toFixed(2))}
  <div class="p-dbl"></div>
  ${row('Auth by:',    d.auth)}
  <div class="p-gap"></div>`;
}

async function generateIndent() {
  const d = getForm();
  if (!validate(d)) return;

  // Save to Firestore (or skip gracefully if not connected)
  try {
    if (dbOK) {
      await window._db.addRecord(d);
      counter++;
      await window._db.saveCounter(counter);
    } else {
      // fallback: local only
      records.push(d);
      counter++;
      renderTable();
    }
    updateIndentNo();
  } catch(e) {
    console.error('Save failed', e);
  }

  document.getElementById('printArea').innerHTML = buildPrint(d);
  setTimeout(() => window.print(), 200);
}

function resetForm() {
  document.getElementById('fCompany').value = '';
  document.getElementById('fAmount').value  = '';
  document.getElementById('errMsg').textContent = '';
  onCompanyChange();
}

// ─────────────────────────────────────────
// RECORDS TABLE
// ─────────────────────────────────────────
function renderTable() {
  const body = document.getElementById('recBody');
  document.getElementById('recCount').textContent = records.length + ' record(s)';
  if (!records.length) {
    body.innerHTML = '<tr><td colspan="11" class="empty">No records yet.</td></tr>';
    return;
  }
  // Sort by ts descending for display
  const sorted = [...records].sort((a,b) => (b.ts||0) - (a.ts||0));
  body.innerHTML = sorted.map(r => `
    <tr>
      <td>${r.indentNo}</td>
      <td>${fmtDate(r.date)}</td>
      <td>${r.company}</td>
      <td>${r.driver}</td>
      <td><b>${r.vehicle}</b></td>
      <td>${r.station}</td>
      <td>${r.fuel}</td>
      <td>&#x20B9;${(r.rate||0).toFixed(2)}</td>
      <td>${(r.litres||0).toFixed(2)} L</td>
      <td>&#x20B9;${(r.amount||0).toFixed(2)}</td>
      <td>${r.auth}</td>
    </tr>`).join('');
}

// ─────────────────────────────────────────
// CLEAR RECORDS
// ─────────────────────────────────────────
async function doClearRecords() {
  try {
    if (dbOK) {
      await window._db.clearRecords();
      counter = 1;
      await window._db.saveCounter(1);
    } else {
      records = [];
      counter = 1;
      renderTable();
    }
    updateIndentNo();
  } catch(e) {
    alert('Error clearing records: ' + e.message);
  }
}

// ─────────────────────────────────────────
// EXPORT EXCEL
// ─────────────────────────────────────────
function exportExcel() {
  if (!records.length) { alert('No records to export.'); return; }
  const sorted = [...records].sort((a,b) => (a.ts||0)-(b.ts||0));
  const rows = [
    ['Indent No','Date','Company','Driver','Vehicle','Station','Fuel','Rate/L (₹)','Litres','Amount (₹)','Auth By'],
    ...sorted.map(r => [r.indentNo,r.date,r.company,r.driver,r.vehicle,r.station,r.fuel,r.rate,r.litres,r.amount,r.auth])
  ];
  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws['!cols'] = [12,12,18,18,16,24,8,10,8,12,18].map(w=>({wch:w}));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Fuel Indents');
  XLSX.writeFile(wb, 'FuelIndents_' + todayISO() + '.xlsx');
}

// ─────────────────────────────────────────
// SETTINGS
// ─────────────────────────────────────────
function renderSettings() {
  const cont = document.getElementById('settingsContainer');
  if (!document.getElementById('page-settings').classList.contains('active')) return;
  cont.innerHTML = '';
  companies.forEach((c, ci) => {
    const div = document.createElement('div');
    div.className = 'settings-card';
    div.innerHTML = `
      <h3>Company ${ci+1}</h3>
      <input class="co-name-input" id="co_name_${ci}" value="${esc(c.name)}" placeholder="Company Name">
      ${mkEditor(ci,'drivers',    'Drivers')}
      ${mkEditor(ci,'vehicles',   'Vehicle Numbers')}
      ${mkEditor(ci,'stations',   'Petrol Bunks / Stations')}
      ${mkEditor(ci,'authorizers','Authorized By')}`;
    cont.appendChild(div);
  });
}

function mkEditor(ci, key, label) {
  const rows = (companies[ci][key]||[]).map((v,ii) => `
    <div class="list-item">
      <input type="text" value="${esc(v)}" id="li_${ci}_${key}_${ii}">
      <button onclick="removeItem(${ci},'${key}',${ii})">✕</button>
    </div>`).join('');
  return `
    <div style="margin-bottom:10px;">
      <div style="font-size:11px;font-weight:bold;text-transform:uppercase;color:#555;margin-bottom:4px;">${label}</div>
      <div class="list-editor" id="list_${ci}_${key}">${rows}</div>
      <button class="add-btn" onclick="addItem(${ci},'${key}')">+ Add</button>
    </div>`;
}

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
function addItem(ci,key)       { companies[ci][key].push(''); renderSettings(); }
function removeItem(ci,key,ii) { companies[ci][key].splice(ii,1); renderSettings(); }

async function saveSettings() {
  companies.forEach((c,ci) => {
    c.name = (document.getElementById('co_name_'+ci).value||'').trim() || c.name;
    ['drivers','vehicles','stations','authorizers'].forEach(key => {
      c[key] = Array.from(document.getElementById('list_'+ci+'_'+key)
        .querySelectorAll('input[type="text"]'))
        .map(i=>i.value.trim()).filter(v=>v!=='');
    });
  });

  try {
    if (dbOK) await window._db.saveSettings(companies);
    populateCompanies();
    document.getElementById('settingsMsg').textContent = '✓ Settings saved to cloud.';
  } catch(e) {
    document.getElementById('settingsMsg').textContent = '⚠ Save failed: ' + e.message;
  }
  setTimeout(()=>document.getElementById('settingsMsg').textContent='', 3000);
  renderSettings();
}

// ─────────────────────────────────────────
// TABS
// ─────────────────────────────────────────
function showTab(name) {
  const names = ['indent','records','settings'];
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', names[i]===name));
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  if (name === 'records')  renderTable();
  if (name === 'settings') renderSettings();
}

// ─────────────────────────────────────────
// PASSWORD MODAL
// ─────────────────────────────────────────
let _pwTarget = null;

function requireAdmin(target) {
  _pwTarget = target;
  document.getElementById('pwTitle').textContent =
    target === 'clearRecords' ? 'Admin: Clear All Records' : 'Admin: Settings';
  document.getElementById('pwInput').value = '';
  document.getElementById('pwErr').textContent = '';
  document.getElementById('pwModal').classList.add('show');
  setTimeout(() => document.getElementById('pwInput').focus(), 120);
}

function pwCancel() {
  document.getElementById('pwModal').classList.remove('show');
  _pwTarget = null;
}

function pwSubmit() {
  const val = document.getElementById('pwInput').value;
  if (val !== ADMIN_PASS) {
    document.getElementById('pwErr').textContent = 'Incorrect password.';
    document.getElementById('pwInput').value = '';
    document.getElementById('pwInput').focus();
    return;
  }
  document.getElementById('pwModal').classList.remove('show');
  const target = _pwTarget;
  _pwTarget = null;

  if (target === 'settings') {
    showTab('settings');
  } else if (target === 'clearRecords') {
    if (confirm('Delete ALL indent records permanently? This cannot be undone.')) {
      doClearRecords();
    }
  }
}
</script>
