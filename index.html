<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fuel Indent</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: Arial, sans-serif;
  font-size: 13px;
  background: #e8e8e8;
  padding: 12px;
}

/* ── NAV TABS ── */
.tabs {
  display: flex;
  gap: 4px;
  margin-bottom: 12px;
}
.tab {
  padding: 7px 18px;
  border: 1px solid #999;
  background: #ddd;
  cursor: pointer;
  font-size: 13px;
  font-weight: bold;
}
.tab.active {
  background: #fff;
  border-bottom: 1px solid #fff;
  position: relative;
  top: 1px;
}

.page { display: none; }
.page.active { display: block; }

/* ── CARD ── */
.card {
  background: #fff;
  border: 1px solid #bbb;
  padding: 14px;
  max-width: 480px;
  margin: 0 auto 14px auto;
}
.card h3 {
  font-size: 13px;
  font-weight: bold;
  border-bottom: 1px solid #ccc;
  padding-bottom: 6px;
  margin-bottom: 10px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

/* ── FORM ── */
.field { margin-bottom: 9px; }
.field label {
  display: block;
  font-size: 11px;
  font-weight: bold;
  text-transform: uppercase;
  color: #555;
  margin-bottom: 3px;
}
.field select, .field input[type="text"], .field input[type="number"], .field input[type="date"] {
  width: 100%;
  padding: 6px 8px;
  font-size: 13px;
  border: 1px solid #bbb;
}
.field select:focus, .field input:focus { outline: 2px solid #333; }

.row2 { display: flex; gap: 8px; }
.row2 .field { flex: 1; }

.auto-val {
  background: #f4f4f4;
  border: 1px solid #ccc;
  padding: 6px 8px;
  font-size: 13px;
  font-weight: bold;
  min-height: 30px;
  color: #111;
}

.err { color: #c00; font-size: 11px; margin-top: 5px; min-height: 16px; }

/* ── BUTTONS ── */
.btn-row { display: flex; gap: 8px; margin-top: 10px; }
button {
  flex: 1;
  padding: 8px;
  font-size: 13px;
  font-weight: bold;
  border: 1px solid #555;
  background: #fff;
  cursor: pointer;
}
button:hover { background: #eee; }
.btn-dark { background: #222; color: #fff; border-color: #222; }
.btn-dark:hover { background: #444; }
.btn-green { background: #1a6630; color: #fff; border-color: #1a6630; }
.btn-green:hover { background: #0f4a22; }
.btn-red { background: #a00; color: #fff; border-color: #a00; }
.btn-red:hover { background: #c00; }

/* ── RECORDS TABLE ── */
.records-card {
  background: #fff;
  border: 1px solid #bbb;
  padding: 14px;
  max-width: 1000px;
  margin: 0 auto;
}
.rec-hdr {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
  flex-wrap: wrap;
  gap: 8px;
}
.rec-hdr h3 { font-size: 13px; font-weight: bold; text-transform: uppercase; }
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
th { background: #333; color: #fff; padding: 6px 8px; text-align: left; font-size: 11px; white-space: nowrap; }
td { padding: 5px 8px; border-bottom: 1px solid #e0e0e0; white-space: nowrap; }
tr:hover td { background: #f9f9f9; }
.empty { text-align: center; padding: 20px; color: #999; }

/* ── SETTINGS ── */
.settings-card {
  background: #fff;
  border: 1px solid #bbb;
  padding: 14px;
  max-width: 540px;
  margin: 0 auto 14px auto;
}
.settings-card h3 {
  font-size: 13px;
  font-weight: bold;
  border-bottom: 1px solid #ccc;
  padding-bottom: 6px;
  margin-bottom: 10px;
  text-transform: uppercase;
}
.co-section {
  margin-bottom: 14px;
  border: 1px solid #ddd;
  padding: 10px;
}
.co-section h4 {
  font-size: 12px;
  font-weight: bold;
  margin-bottom: 8px;
  text-transform: uppercase;
  color: #333;
}
.list-editor { display: flex; flex-direction: column; gap: 5px; margin-bottom: 6px; }
.list-item {
  display: flex;
  gap: 6px;
  align-items: center;
}
.list-item input {
  flex: 1;
  padding: 4px 6px;
  font-size: 12px;
  border: 1px solid #bbb;
}
.list-item button {
  flex: none;
  padding: 4px 8px;
  font-size: 12px;
  background: #eee;
  border: 1px solid #bbb;
  color: #a00;
  font-weight: bold;
  cursor: pointer;
}
.list-item button:hover { background: #fdd; }
.add-btn {
  font-size: 12px;
  padding: 4px 10px;
  background: #eee;
  border: 1px solid #bbb;
  cursor: pointer;
  font-weight: bold;
}
.add-btn:hover { background: #ddd; }
.co-name-input {
  width: 100%;
  padding: 5px 7px;
  font-size: 13px;
  border: 1px solid #bbb;
  margin-bottom: 8px;
  font-weight: bold;
}

/* ── PASSWORD LOCK ── */
.lock-screen {
  background: #fff;
  border: 1px solid #bbb;
  padding: 24px 18px;
  max-width: 320px;
  margin: 40px auto;
  text-align: center;
}
.lock-screen .lock-icon { font-size: 2rem; margin-bottom: 10px; }
.lock-screen h3 {
  font-size: 13px;
  font-weight: bold;
  text-transform: uppercase;
  margin-bottom: 14px;
  letter-spacing: 0.5px;
}
.lock-screen input[type="password"] {
  width: 100%;
  padding: 8px 10px;
  font-size: 14px;
  border: 1px solid #bbb;
  margin-bottom: 8px;
  text-align: center;
  letter-spacing: 3px;
}
.lock-screen input[type="password"]:focus { outline: 2px solid #333; }
.lock-err { color: #c00; font-size: 11px; min-height: 16px; margin-bottom: 6px; }
.lock-hint { font-size: 10px; color: #999; margin-top: 8px; }
.change-pw-section {
  background: #f9f9f9;
  border: 1px solid #ddd;
  padding: 12px;
  max-width: 540px;
  margin: 0 auto 12px auto;
}
.change-pw-section h4 {
  font-size: 12px;
  font-weight: bold;
  text-transform: uppercase;
  margin-bottom: 10px;
  color: #333;
}
.pw-row { display: flex; gap: 8px; align-items: center; margin-bottom: 7px; }
.pw-row label { font-size: 11px; font-weight: bold; width: 120px; flex-shrink: 0; text-transform: uppercase; color: #555; }
.pw-row input { flex: 1; padding: 5px 7px; font-size: 13px; border: 1px solid #bbb; }

/* ── PRINT STYLES ── */
#printArea { display: none; }

@media print {
  body > *:not(#printArea) { display: none !important; }
  #printArea {
    display: block !important;
    width: 72mm;
    font-family: 'Courier New', Courier, monospace;
    font-size: 8.5pt;
    color: #000;
    padding: 1mm 2mm;
  }
  @page { size: 80mm auto; margin: 0; }

  .p-center { text-align: center; }
  .p-bold { font-weight: bold; }
  .p-big { font-size: 10.5pt; font-weight: bold; }
  .p-sm { font-size: 7.5pt; }
  .p-line { border-top: 1px dashed #000; margin: 3px 0; }
  .p-dbl { border-top: 2px solid #000; margin: 3px 0; }
  .p-row {
    display: flex;
    justify-content: space-between;
    margin: 2px 0;
    gap: 4px;
  }
  .p-lbl { flex-shrink: 0; }
  .p-val { text-align: right; font-weight: bold; word-break: break-all; }
  .p-sign-row {
    display: flex;
    justify-content: space-between;
    margin-top: 8mm;
  }
  .p-sign { text-align: center; font-size: 7.5pt; }
  .p-sign-line { border-top: 1px solid #000; width: 27mm; margin: 0 auto 2px auto; }
  .p-gap { height: 3mm; }
}
</style>
</head>
<body>

<!-- TABS -->
<div class="tabs">
  <div class="tab active" onclick="showTab('indent')">New Indent</div>
  <div class="tab" onclick="showTab('records')">Records</div>
  <div class="tab" onclick="showTab('settings')">Settings</div>
</div>

<!-- ══════════ INDENT FORM ══════════ -->
<div id="page-indent" class="page active">
  <div class="card">
    <h3>Fuel Indent</h3>

    <!-- STEP 1: Company -->
    <div class="field">
      <label>Company</label>
      <select id="fCompany" onchange="onCompanyChange()">
        <option value="">-- Select Company --</option>
      </select>
    </div>

    <div class="row2">
      <div class="field">
        <label>Indent No.</label>
        <div class="auto-val" id="dispIndentNo">—</div>
      </div>
      <div class="field">
        <label>Date</label>
        <input type="date" id="fDate">
      </div>
    </div>

    <div class="field">
      <label>Driver Name</label>
      <select id="fDriver" disabled>
        <option value="">-- Select Company First --</option>
      </select>
    </div>

    <div class="field">
      <label>Vehicle Number</label>
      <select id="fVehicle" disabled>
        <option value="">-- Select Company First --</option>
      </select>
    </div>

    <div class="field">
      <label>Petrol Bunk / Station</label>
      <select id="fStation" disabled>
        <option value="">-- Select Company First --</option>
      </select>
    </div>

    <div class="row2">
      <div class="field">
        <label>Fuel Type</label>
        <select id="fFuel" onchange="onFuelChange()" disabled>
          <option value="">-- Select --</option>
          <option value="Petrol">Petrol</option>
          <option value="Diesel">Diesel</option>
          <option value="CNG">CNG</option>
        </select>
      </div>
      <div class="field">
        <label>Authorized By</label>
        <select id="fAuth" disabled>
          <option value="">-- Select Company First --</option>
        </select>
      </div>
    </div>

    <div class="row2">
      <div class="field">
        <label>IOC Rate/Litre (₹)</label>
        <div class="auto-val" id="dispRate">—</div>
      </div>
      <div class="field">
        <label>Amount (₹)</label>
        <input type="number" id="fAmount" placeholder="0.00" step="0.01" min="0" oninput="calcLitres()">
      </div>
    </div>

    <div class="field">
      <label>Litres (auto-calculated)</label>
      <div class="auto-val" id="dispLitres">—</div>
    </div>

    <div class="err" id="errMsg"></div>

    <div class="btn-row">
      <button onclick="resetForm()">Clear</button>
      <button class="btn-dark" onclick="generateIndent()">Print Indent</button>
      <button class="btn-green" onclick="exportExcel()">Export Excel</button>
    </div>
  </div>
</div>

<!-- ══════════ RECORDS ══════════ -->
<div id="page-records" class="page">
  <div class="records-card">
    <div class="rec-hdr">
      <h3>Indent Records</h3>
      <div style="display:flex;gap:8px;align-items:center;">
        <span id="recCount" style="font-size:11px;color:#666;">0 records</span>
        <button class="btn-red" style="flex:none;padding:5px 12px;font-size:12px;" onclick="clearAll()">Clear All</button>
        <button class="btn-green" style="flex:none;padding:5px 12px;font-size:12px;" onclick="exportExcel()">Export Excel</button>
      </div>
    </div>
    <div class="tbl-wrap">
      <table>
        <thead>
          <tr>
            <th>Indent No</th><th>Date</th><th>Company</th><th>Driver</th>
            <th>Vehicle</th><th>Station</th><th>Fuel</th>
            <th>Rate/L</th><th>Litres</th><th>Amount</th><th>Auth By</th>
          </tr>
        </thead>
        <tbody id="recBody">
          <tr><td colspan="11" class="empty">No records yet.</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- ══════════ SETTINGS ══════════ -->
<div id="page-settings" class="page">
  <div id="settingsContainer"></div>
  <div style="max-width:540px;margin:0 auto;">
    <div class="btn-row">
      <button class="btn-dark" onclick="saveSettings()">Save Settings</button>
    </div>
    <div class="err" id="settingsMsg" style="color:green;margin-top:6px;"></div>
  </div>
</div>

<!-- PRINT AREA -->
<div id="printArea"></div>

<script>
// ══════════════════════════════════════════
// DEFAULT IOC RATES (Karnataka, May 2026)
// ══════════════════════════════════════════
const IOC = { Petrol: 102.92, Diesel: 90.99, CNG: 78.00 };

// ══════════════════════════════════════════
// STATE
// ══════════════════════════════════════════
let records = JSON.parse(localStorage.getItem('fi_records') || '[]');
let counter = parseInt(localStorage.getItem('fi_counter') || '1');

// Default companies config
const DEFAULT_COMPANIES = [
  {
    name: 'Company A',
    drivers: ['Driver 1', 'Driver 2'],
    vehicles: ['KA-01-AA-0001', 'KA-01-AA-0002'],
    stations: ['Indian Oil, MG Road', 'Indian Oil, Hebbal'],
    authorizers: ['Manager A']
  },
  {
    name: 'Company B',
    drivers: ['Driver 3', 'Driver 4'],
    vehicles: ['KA-02-BB-0001', 'KA-02-BB-0002'],
    stations: ['Indian Oil, Whitefield', 'Indian Oil, Koramangala'],
    authorizers: ['Manager B']
  }
];

let companies = JSON.parse(localStorage.getItem('fi_companies') || JSON.stringify(DEFAULT_COMPANIES));

// ══════════════════════════════════════════
// TABS
// ══════════════════════════════════════════
function showTab(name) {
  document.querySelectorAll('.tab').forEach((t,i) => {
    t.classList.toggle('active', ['indent','records','settings'][i] === name);
  });
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  if (name === 'settings') renderSettings();
  if (name === 'records') renderTable();
}

// ══════════════════════════════════════════
// INIT
// ══════════════════════════════════════════
window.onload = function() {
  document.getElementById('fDate').value = new Date().toISOString().split('T')[0];
  populateCompanies();
  updateIndentNo();
  renderTable();
};

function updateIndentNo() {
  document.getElementById('dispIndentNo').textContent = 'FI-' + String(counter).padStart(4,'0');
}

function populateCompanies() {
  const sel = document.getElementById('fCompany');
  sel.innerHTML = '<option value="">-- Select Company --</option>';
  companies.forEach((c, i) => {
    const o = document.createElement('option');
    o.value = i;
    o.textContent = c.name;
    sel.appendChild(o);
  });
}

function onCompanyChange() {
  const idx = document.getElementById('fCompany').value;
  const fields = ['fDriver','fVehicle','fStation','fAuth','fFuel'];
  if (idx === '') {
    fields.forEach(id => {
      const el = document.getElementById(id);
      el.disabled = true;
      el.innerHTML = '<option value="">-- Select Company First --</option>';
    });
    document.getElementById('dispRate').textContent = '—';
    document.getElementById('dispLitres').textContent = '—';
    return;
  }
  const c = companies[parseInt(idx)];
  fields.forEach(id => document.getElementById(id).disabled = false);

  fillSelect('fDriver', c.drivers);
  fillSelect('fVehicle', c.vehicles);
  fillSelect('fStation', c.stations);
  fillSelect('fAuth', c.authorizers);

  // Reset fuel
  document.getElementById('fFuel').value = '';
  document.getElementById('dispRate').textContent = '—';
  document.getElementById('dispLitres').textContent = '—';
}

function fillSelect(id, items) {
  const sel = document.getElementById(id);
  sel.innerHTML = '<option value="">-- Select --</option>';
  items.forEach(v => {
    const o = document.createElement('option');
    o.value = v; o.textContent = v;
    sel.appendChild(o);
  });
}

function onFuelChange() {
  const f = document.getElementById('fFuel').value;
  document.getElementById('dispRate').textContent = f ? '₹' + IOC[f].toFixed(2) : '—';
  calcLitres();
}

function calcLitres() {
  const amt = parseFloat(document.getElementById('fAmount').value) || 0;
  const f = document.getElementById('fFuel').value;
  const rate = f ? IOC[f] : 0;
  if (amt > 0 && rate > 0) {
    document.getElementById('dispLitres').textContent = (amt / rate).toFixed(2) + ' L';
  } else {
    document.getElementById('dispLitres').textContent = '—';
  }
}

// ══════════════════════════════════════════
// GENERATE & PRINT
// ══════════════════════════════════════════
function getForm() {
  const ci = document.getElementById('fCompany').value;
  const f = document.getElementById('fFuel').value;
  const amt = parseFloat(document.getElementById('fAmount').value) || 0;
  const rate = f ? IOC[f] : 0;
  return {
    indentNo: 'FI-' + String(counter).padStart(4,'0'),
    date: document.getElementById('fDate').value,
    company: ci !== '' ? companies[parseInt(ci)].name : '',
    driver: document.getElementById('fDriver').value,
    vehicle: document.getElementById('fVehicle').value,
    station: document.getElementById('fStation').value,
    fuel: f,
    auth: document.getElementById('fAuth').value,
    rate: rate,
    amount: amt,
    litres: (rate > 0 && amt > 0) ? parseFloat((amt / rate).toFixed(2)) : 0
  };
}

function validate(d) {
  const err = document.getElementById('errMsg');
  if (!d.company) { err.textContent = 'Select a company.'; return false; }
  if (!d.driver) { err.textContent = 'Select driver.'; return false; }
  if (!d.vehicle) { err.textContent = 'Select vehicle.'; return false; }
  if (!d.station) { err.textContent = 'Select station.'; return false; }
  if (!d.fuel) { err.textContent = 'Select fuel type.'; return false; }
  if (!d.auth) { err.textContent = 'Select authorized by.'; return false; }
  if (!d.amount) { err.textContent = 'Enter amount.'; return false; }
  err.textContent = '';
  return true;
}

function fmtDate(s) {
  if (!s) return '';
  const [y,m,d] = s.split('-');
  const mo = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return d + '-' + mo[parseInt(m)-1] + '-' + y;
}

function buildPrint(d) {
  const row = (l, v) => `<div class="p-row"><span class="p-lbl">${l}</span><span class="p-val">${v}</span></div>`;
  return `
  <div class="p-center p-big">FUEL INDENT</div>
  <div class="p-center p-sm">${d.company}</div>
  <div class="p-dbl"></div>
  <div class="p-row"><span class="p-lbl">Indent No:</span><span class="p-val p-bold">${d.indentNo}</span></div>
  <div class="p-row"><span class="p-lbl">Date:</span><span class="p-val">${fmtDate(d.date)}</span></div>
  <div class="p-line"></div>
  ${row('Driver:', d.driver)}
  ${row('Vehicle:', d.vehicle)}
  ${row('Station:', d.station)}
  ${row('Fuel:', d.fuel)}
  <div class="p-line"></div>
  ${row('IOC Rate/L:', '₹' + d.rate.toFixed(2))}
  ${row('Litres:', d.litres.toFixed(2) + ' L')}
  <div class="p-dbl"></div>
  ${row('AMOUNT:', '₹' + d.amount.toFixed(2))}
  <div class="p-dbl"></div>
  <div class="p-sign-row">
    <div class="p-sign"><div class="p-sign-line"></div>Driver</div>
    <div class="p-sign"><div class="p-sign-line"></div>${d.auth}</div>
  </div>
  <div class="p-gap"></div>
  <div class="p-center p-sm">Indian Oil Corporation</div>
  <div class="p-gap"></div>`;
}

function generateIndent() {
  const d = getForm();
  if (!validate(d)) return;
  records.push(d);
  localStorage.setItem('fi_records', JSON.stringify(records));
  counter++;
  localStorage.setItem('fi_counter', String(counter));
  updateIndentNo();
  renderTable();
  document.getElementById('printArea').innerHTML = buildPrint(d);
  setTimeout(() => window.print(), 200);
}

function resetForm() {
  document.getElementById('fCompany').value = '';
  document.getElementById('fDate').value = new Date().toISOString().split('T')[0];
  document.getElementById('fAmount').value = '';
  document.getElementById('errMsg').textContent = '';
  onCompanyChange();
}

// ══════════════════════════════════════════
// RECORDS TABLE
// ══════════════════════════════════════════
function renderTable() {
  const body = document.getElementById('recBody');
  document.getElementById('recCount').textContent = records.length + ' record(s)';
  if (!records.length) {
    body.innerHTML = '<tr><td colspan="11" class="empty">No records yet.</td></tr>';
    return;
  }
  body.innerHTML = records.slice().map(r => `
    <tr>
      <td>${r.indentNo}</td>
      <td>${fmtDate(r.date)}</td>
      <td>${r.company}</td>
      <td>${r.driver}</td>
      <td><b>${r.vehicle}</b></td>
      <td>${r.station}</td>
      <td>${r.fuel}</td>
      <td>₹${r.rate.toFixed(2)}</td>
      <td>${r.litres.toFixed(2)} L</td>
      <td>₹${r.amount.toFixed(2)}</td>
      <td>${r.auth}</td>
    </tr>`).join('');
}

function clearAll() {
  if (!confirm('Delete ALL indent records? Cannot be undone.')) return;
  records = []; counter = 1;
  localStorage.setItem('fi_records', '[]');
  localStorage.setItem('fi_counter', '1');
  updateIndentNo();
  renderTable();
}

// ══════════════════════════════════════════
// EXPORT EXCEL
// ══════════════════════════════════════════
function exportExcel() {
  if (!records.length) { alert('No records to export.'); return; }
  const rows = [
    ['Indent No','Date','Company','Driver','Vehicle','Station','Fuel','Rate/L (₹)','Litres','Amount (₹)','Auth By'],
    ...records.map(r => [r.indentNo,r.date,r.company,r.driver,r.vehicle,r.station,r.fuel,r.rate,r.litres,r.amount,r.auth])
  ];
  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws['!cols'] = [12,12,18,18,16,24,8,10,8,12,18].map(w=>({wch:w}));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Fuel Indents');
  XLSX.writeFile(wb, 'FuelIndents_' + new Date().toISOString().slice(0,10) + '.xlsx');
}

// ══════════════════════════════════════════
// SETTINGS
// ══════════════════════════════════════════
function renderSettings() {
  const cont = document.getElementById('settingsContainer');
  cont.innerHTML = '';
  companies.forEach((c, ci) => {
    const div = document.createElement('div');
    div.className = 'settings-card';
    div.innerHTML = `
      <h3>Company ${ci + 1}</h3>
      <input class="co-name-input" id="co_name_${ci}" value="${esc(c.name)}" placeholder="Company Name">
      ${buildListEditor(ci, 'drivers', 'Drivers', c.drivers)}
      ${buildListEditor(ci, 'vehicles', 'Vehicle Numbers', c.vehicles)}
      ${buildListEditor(ci, 'stations', 'Petrol Bunks / Stations', c.stations)}
      ${buildListEditor(ci, 'authorizers', 'Authorized By', c.authorizers)}
    `;
    cont.appendChild(div);
  });
}

function buildListEditor(ci, key, label, items) {
  const rows = items.map((v, ii) =>
    `<div class="list-item" id="li_${ci}_${key}_${ii}">
      <input type="text" value="${esc(v)}" id="li_val_${ci}_${key}_${ii}">
      <button onclick="removeItem(${ci},'${key}',${ii})">✕</button>
    </div>`
  ).join('');
  return `
    <div style="margin-bottom:10px;">
      <div style="font-size:11px;font-weight:bold;text-transform:uppercase;color:#555;margin-bottom:5px;">${label}</div>
      <div class="list-editor" id="list_${ci}_${key}">${rows}</div>
      <button class="add-btn" onclick="addItem(${ci},'${key}')">+ Add ${label.slice(0,-1)}</button>
    </div>`;
}

function esc(s) { return String(s).replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

function addItem(ci, key) {
  companies[ci][key].push('');
  renderSettings();
}

function removeItem(ci, key, ii) {
  companies[ci][key].splice(ii, 1);
  renderSettings();
}

function saveSettings() {
  // Read all current values from inputs
  companies.forEach((c, ci) => {
    c.name = document.getElementById('co_name_' + ci).value.trim() || c.name;
    ['drivers','vehicles','stations','authorizers'].forEach(key => {
      const container = document.getElementById('list_' + ci + '_' + key);
      const inputs = container.querySelectorAll('input[type="text"]');
      c[key] = Array.from(inputs).map(inp => inp.value.trim()).filter(v => v !== '');
    });
  });
  localStorage.setItem('fi_companies', JSON.stringify(companies));
  populateCompanies();
  document.getElementById('settingsMsg').textContent = '✓ Settings saved!';
  setTimeout(() => document.getElementById('settingsMsg').textContent = '', 2500);
  renderSettings();
}
</script>
</body>
</html>
