<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fuel Indent</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; font-size: 13px; background: #e8e8e8; padding: 12px; }

.tabs { display: flex; gap: 4px; margin-bottom: 12px; }
.tab { padding: 7px 18px; border: 1px solid #999; background: #ddd; cursor: pointer; font-size: 13px; font-weight: bold; user-select: none; }
.tab.active { background: #fff; border-bottom: 1px solid #fff; position: relative; top: 1px; }
.page { display: none; }
.page.active { display: block; }

.card { background: #fff; border: 1px solid #bbb; padding: 14px; max-width: 480px; margin: 0 auto 14px auto; }
.card h3 { font-size: 13px; font-weight: bold; border-bottom: 1px solid #ccc; padding-bottom: 6px; margin-bottom: 10px; text-transform: uppercase; }

.field { margin-bottom: 9px; }
.field label { display: block; font-size: 11px; font-weight: bold; text-transform: uppercase; color: #555; margin-bottom: 3px; }
.field select, .field input[type="number"] { width: 100%; padding: 6px 8px; font-size: 13px; border: 1px solid #bbb; }
.field select:focus, .field input:focus { outline: 2px solid #333; }
.row2 { display: flex; gap: 8px; }
.row2 .field { flex: 1; }

.auto-val { background: #f4f4f4; border: 1px solid #ccc; padding: 6px 8px; font-size: 13px; font-weight: bold; min-height: 30px; color: #111; }
.auto-val.muted { font-weight: normal; color: #888; font-style: italic; }
.auto-val.err-val { font-weight: normal; color: #b00; font-size: 11px; font-style: normal; }

.err { color: #c00; font-size: 11px; margin-top: 5px; min-height: 16px; }

.btn-row { display: flex; gap: 8px; margin-top: 10px; }
button { flex: 1; padding: 8px; font-size: 13px; font-weight: bold; border: 1px solid #555; background: #fff; cursor: pointer; }
button:hover { background: #eee; }
.btn-dark { background: #222; color: #fff; border-color: #222; }
.btn-dark:hover { background: #444; }
.btn-green { background: #1a6630; color: #fff; border-color: #1a6630; }
.btn-green:hover { background: #0f4a22; }
.btn-red { background: #a00; color: #fff; border-color: #a00; }
.btn-red:hover { background: #c00; }

/* rate bar */
.rate-bar { max-width: 480px; margin: 0 auto 10px auto; background: #fff; border: 1px solid #bbb; padding: 7px 12px; font-size: 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.rate-bar b { font-size: 12px; }
.rate-refresh { font-size: 11px; color: #1a6630; cursor: pointer; text-decoration: underline; white-space: nowrap; }

/* records */
.records-card { background: #fff; border: 1px solid #bbb; padding: 14px; max-width: 1100px; margin: 0 auto; }
.rec-hdr { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; flex-wrap: wrap; gap: 8px; }
.rec-hdr h3 { font-size: 13px; font-weight: bold; text-transform: uppercase; }
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
th { background: #333; color: #fff; padding: 6px 8px; text-align: left; font-size: 11px; white-space: nowrap; }
td { padding: 5px 8px; border-bottom: 1px solid #e0e0e0; white-space: nowrap; }
tr:hover td { background: #f9f9f9; }
.empty { text-align: center; padding: 20px; color: #999; }

/* settings */
.settings-card { background: #fff; border: 1px solid #bbb; padding: 14px; max-width: 540px; margin: 0 auto 14px auto; }
.settings-card h3 { font-size: 13px; font-weight: bold; border-bottom: 1px solid #ccc; padding-bottom: 6px; margin-bottom: 10px; text-transform: uppercase; }
.list-editor { display: flex; flex-direction: column; gap: 5px; margin-bottom: 6px; }
.list-item { display: flex; gap: 6px; align-items: center; }
.list-item input { flex: 1; padding: 4px 6px; font-size: 12px; border: 1px solid #bbb; }
.list-item button { flex: none; padding: 4px 8px; font-size: 12px; background: #eee; border: 1px solid #bbb; color: #a00; font-weight: bold; cursor: pointer; }
.list-item button:hover { background: #fdd; }
.add-btn { font-size: 12px; padding: 4px 10px; background: #eee; border: 1px solid #bbb; cursor: pointer; font-weight: bold; margin-top: 2px; }
.add-btn:hover { background: #ddd; }
.co-name-input { width: 100%; padding: 5px 7px; font-size: 13px; border: 1px solid #bbb; margin-bottom: 8px; font-weight: bold; }

/* modal */
.modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100; align-items: center; justify-content: center; }
.modal-bg.show { display: flex; }
.modal { background: #fff; border: 1px solid #aaa; padding: 22px 24px; width: 280px; max-width: 90%; }
.modal h4 { font-size: 13px; font-weight: bold; margin-bottom: 12px; text-transform: uppercase; }
.modal input[type="password"] { width: 100%; padding: 7px 9px; font-size: 14px; border: 1px solid #bbb; margin-bottom: 6px; letter-spacing: 4px; }
.modal input[type="password"]:focus { outline: 2px solid #333; }
.modal .merr { color: #c00; font-size: 11px; min-height: 16px; margin-bottom: 6px; }
.modal .mbtn-row { display: flex; gap: 8px; }

/* PRINT - 58mm thermal */
#printArea { display: none; }
@media print {
  body > *:not(#printArea) { display: none !important; }
  #printArea {
    display: block !important;
    width: 50mm;
    font-family: 'Courier New', Courier, monospace;
    font-size: 7.5pt;
    color: #000;
    padding: 1mm 1.5mm;
  }
  @page { size: 58mm auto; margin: 0; }
  .p-center { text-align: center; }
  .p-big { font-size: 9pt; font-weight: bold; }
  .p-sm { font-size: 6.5pt; }
  .p-line { border-top: 1px dashed #000; margin: 2.5px 0; }
  .p-dbl { border-top: 2px solid #000; margin: 2.5px 0; }
  .p-row { display: flex; justify-content: space-between; margin: 1.5px 0; gap: 2px; }
  .p-val { text-align: right; font-weight: bold; flex-shrink: 0; }
  .p-gap { height: 4mm; }
}
</style>
</head>
<body>

<!-- PASSWORD MODAL -->
<div class="modal-bg" id="pwModal">
  <div class="modal">
    <h4 id="pwTitle">Admin Access</h4>
    <input type="password" id="pwInput" placeholder="Password" maxlength="20"
           onkeydown="if(event.key==='Enter') pwSubmit()">
    <div class="merr" id="pwErr"></div>
    <div class="mbtn-row">
      <button onclick="pwCancel()">Cancel</button>
      <button class="btn-dark" onclick="pwSubmit()">OK</button>
    </div>
  </div>
</div>

<!-- TABS -->
<div class="tabs">
  <div class="tab active"  onclick="showTab('indent')">New Indent</div>
  <div class="tab"         onclick="showTab('records')">Records</div>
  <div class="tab"         onclick="requireAdmin('settings')">Settings 🔒</div>
</div>

<!-- ══ INDENT ══ -->
<div id="page-indent" class="page active">

  <div class="rate-bar">
    <span>IOC Rates (Mysuru, Karnataka):</span>
    <b id="rateBarTxt">Fetching live rates…</b>
    <span class="rate-refresh" onclick="fetchRates()">↻ Refresh</span>
  </div>

  <div class="card">
    <h3>Fuel Indent</h3>

    <div class="field">
      <label>Company</label>
      <select id="fCompany" onchange="onCompanyChange()">
        <option value="">-- Select Company --</option>
      </select>
    </div>

    <div class="row2">
      <div class="field">
        <label>Indent No.</label>
        <div class="auto-val" id="dispIndentNo">—</div>
      </div>
      <div class="field">
        <label>Date</label>
        <div class="auto-val" id="dispDate">—</div>
      </div>
    </div>

    <div class="field">
      <label>Driver Name</label>
      <select id="fDriver" disabled>
        <option value="">-- Select Company First --</option>
      </select>
    </div>

    <div class="field">
      <label>Vehicle Number</label>
      <select id="fVehicle" disabled>
        <option value="">-- Select Company First --</option>
      </select>
    </div>

    <div class="field">
      <label>Petrol Bunk / Station</label>
      <select id="fStation" disabled>
        <option value="">-- Select Company First --</option>
      </select>
    </div>

    <div class="row2">
      <div class="field">
        <label>Fuel Type</label>
        <select id="fFuel" onchange="onFuelChange()" disabled>
          <option value="">-- Select --</option>
          <option value="Petrol">Petrol</option>
          <option value="Diesel">Diesel</option>
          <option value="CNG">CNG</option>
        </select>
      </div>
      <div class="field">
        <label>Authorized By</label>
        <select id="fAuth" disabled>
          <option value="">-- Select Company First --</option>
        </select>
      </div>
    </div>

    <div class="row2">
      <div class="field">
        <label>IOC Rate / Litre (₹)</label>
        <div class="auto-val muted" id="dispRate">Fetching…</div>
      </div>
      <div class="field">
        <label>Amount (₹)</label>
        <input type="number" id="fAmount" placeholder="0.00" step="0.01" min="0" oninput="calcLitres()">
      </div>
    </div>

    <div class="field">
      <label>Litres (auto-calculated)</label>
      <div class="auto-val" id="dispLitres">—</div>
    </div>

    <div class="err" id="errMsg"></div>

    <div class="btn-row">
      <button onclick="resetForm()">Clear</button>
      <button class="btn-dark" onclick="generateIndent()">Print Indent</button>
    </div>
  </div>
</div>

<!-- ══ RECORDS ══ -->
<div id="page-records" class="page">
  <div class="records-card">
    <div class="rec-hdr">
      <h3>Indent Records</h3>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
        <span id="recCount" style="font-size:11px;color:#666;">0 records</span>
        <button class="btn-red"   style="flex:none;padding:5px 12px;font-size:12px;" onclick="requireAdmin('clearRecords')">Clear All 🔒</button>
        <button class="btn-green" style="flex:none;padding:5px 12px;font-size:12px;" onclick="exportExcel()">Export Excel</button>
      </div>
    </div>
    <div class="tbl-wrap">
      <table>
        <thead>
          <tr>
            <th>Indent No</th><th>Date</th><th>Company</th><th>Driver</th>
            <th>Vehicle</th><th>Station</th><th>Fuel</th>
            <th>Rate/L</th><th>Litres</th><th>Amount</th><th>Auth By</th>
          </tr>
        </thead>
        <tbody id="recBody">
          <tr><td colspan="11" class="empty">No records yet.</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- ══ SETTINGS ══ -->
<div id="page-settings" class="page">
  <div id="settingsContainer"></div>
  <div style="max-width:540px;margin:0 auto;">
    <div class="btn-row">
      <button class="btn-dark" onclick="saveSettings()">Save Settings</button>
    </div>
    <div id="settingsMsg" style="color:green;font-size:12px;margin-top:6px;min-height:16px;"></div>
  </div>
</div>

<!-- PRINT -->
<div id="printArea"></div>

<script>
// ─────────────────────────────────────────
// CONFIG
// ─────────────────────────────────────────
const ADMIN_PASS = '0820';
const FALLBACK   = { Petrol: 103.07, Diesel: 90.99, CNG: null };

// Scrape target: goodreturns Mysore petrol & diesel pages via allorigins proxy
const PROXY   = 'https://api.allorigins.win/get?url=';
const URL_P   = encodeURIComponent('https://www.goodreturns.in/petrol-price-in-mysore.html');
const URL_D   = encodeURIComponent('https://www.goodreturns.in/diesel-price-in-mysore.html');

// ─────────────────────────────────────────
// STATE
// ─────────────────────────────────────────
let records  = JSON.parse(localStorage.getItem('fi_records')  || '[]');
let counter  = parseInt(localStorage.getItem('fi_counter')    || '1');
let companies= JSON.parse(localStorage.getItem('fi_companies')|| JSON.stringify([
  { name:'Company A', drivers:['Driver 1','Driver 2'], vehicles:['KA-01-AA-0001','KA-01-AA-0002'], stations:['Indian Oil, MG Road','Indian Oil, Hebbal'],       authorizers:['Manager A'] },
  { name:'Company B', drivers:['Driver 3','Driver 4'], vehicles:['KA-02-BB-0001','KA-02-BB-0002'], stations:['Indian Oil, Whitefield','Indian Oil, Koramangala'],authorizers:['Manager B'] }
]));

let IOC = { ...FALLBACK };
let rateReady = false;

// ─────────────────────────────────────────
// INIT
// ─────────────────────────────────────────
window.onload = () => {
  setLiveDate();
  populateCompanies();
  updateIndentNo();
  renderTable();
  fetchRates();
};

function setLiveDate() {
  const n = new Date();
  const days  = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const months= ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  document.getElementById('dispDate').textContent =
    days[n.getDay()] + ', ' + n.getDate() + ' ' + months[n.getMonth()] + ' ' + n.getFullYear();
}

function todayISO() {
  const n = new Date();
  return n.getFullYear() + '-' + p2(n.getMonth()+1) + '-' + p2(n.getDate());
}
function p2(n){ return String(n).padStart(2,'0'); }

function updateIndentNo() {
  document.getElementById('dispIndentNo').textContent = 'FI-' + String(counter).padStart(4,'0');
}

// ─────────────────────────────────────────
// LIVE RATE FETCH  (allorigins proxy → goodreturns scrape)
// ─────────────────────────────────────────
async function fetchRates() {
  const barEl  = document.getElementById('rateBarTxt');
  const rateEl = document.getElementById('dispRate');
  barEl.textContent = 'Fetching…';
  rateEl.className  = 'auto-val muted';
  rateEl.textContent= 'Fetching…';

  try {
    const [rP, rD] = await Promise.all([
      fetch(PROXY + URL_P).then(r => r.json()),
      fetch(PROXY + URL_D).then(r => r.json())
    ]);

    const petrol = extractPrice(rP.contents);
    const diesel = extractPrice(rD.contents);

    if (!petrol || !diesel) throw new Error('parse failed');

    IOC.Petrol = petrol;
    IOC.Diesel = diesel;
    rateReady  = true;

    barEl.textContent = `Petrol ₹${petrol.toFixed(2)}/L   Diesel ₹${diesel.toFixed(2)}/L   (live · IOC Mysuru)`;
    onFuelChange();

  } catch(e) {
    // fallback
    IOC = { ...FALLBACK };
    rateReady = false;
    barEl.textContent = `Petrol ₹${IOC.Petrol.toFixed(2)}/L   Diesel ₹${IOC.Diesel.toFixed(2)}/L   ⚠ fallback`;
    onFuelChange();
  }
}

// Extract first price-like value from goodreturns page HTML
function extractPrice(html) {
  if (!html) return null;
  // goodreturns shows "₹103.07 per litre" or "Rs. 103.07 per litre"
  const m = html.match(/(?:₹|Rs\.?\s*)(1\d{2}\.\d{1,2})\s*(?:per\s*li|\/li)/i);
  if (m) return parseFloat(m[1]);
  // fallback: look for any 3-digit.2-digit pattern near "litre"
  const m2 = html.match(/(1\d{2}\.\d{2})\s*per\s*li/i);
  if (m2) return parseFloat(m2[1]);
  return null;
}

// ─────────────────────────────────────────
// FORM LOGIC
// ─────────────────────────────────────────
function populateCompanies() {
  const sel = document.getElementById('fCompany');
  sel.innerHTML = '<option value="">-- Select Company --</option>';
  companies.forEach((c,i) => {
    const o = document.createElement('option');
    o.value = i; o.textContent = c.name; sel.appendChild(o);
  });
}

function onCompanyChange() {
  const idx = document.getElementById('fCompany').value;
  const deps = ['fDriver','fVehicle','fStation','fAuth','fFuel'];
  if (idx === '') {
    deps.forEach(id => {
      const el = document.getElementById(id);
      el.disabled = true;
      el.innerHTML = '<option value="">-- Select Company First --</option>';
    });
    document.getElementById('dispLitres').textContent = '—';
    updateRateDisplay();
    return;
  }
  const c = companies[parseInt(idx)];
  deps.forEach(id => document.getElementById(id).disabled = false);
  fillSel('fDriver',  c.drivers);
  fillSel('fVehicle', c.vehicles);
  fillSel('fStation', c.stations);
  fillSel('fAuth',    c.authorizers);
  document.getElementById('fFuel').value = '';
  document.getElementById('dispLitres').textContent = '—';
  updateRateDisplay();
}

function fillSel(id, items) {
  const s = document.getElementById(id);
  s.innerHTML = '<option value="">-- Select --</option>';
  items.forEach(v => { const o = document.createElement('option'); o.value=v; o.textContent=v; s.appendChild(o); });
}

function onFuelChange() { updateRateDisplay(); calcLitres(); }

function updateRateDisplay() {
  const f  = document.getElementById('fFuel').value;
  const el = document.getElementById('dispRate');
  if (!f) {
    el.className  = 'auto-val muted';
    el.textContent= rateReady ? 'Select fuel type' : 'Fetching…';
    return;
  }
  const rate = IOC[f];
  if (!rate) {
    el.className  = 'auto-val err-val';
    el.textContent= 'Rate unavailable for ' + f;
  } else {
    el.className  = 'auto-val';
    el.textContent= '₹' + rate.toFixed(2) + ' / Litre' + (rateReady ? '' : ' (fallback)');
  }
}

function calcLitres() {
  const amt  = parseFloat(document.getElementById('fAmount').value) || 0;
  const f    = document.getElementById('fFuel').value;
  const rate = f ? IOC[f] : 0;
  document.getElementById('dispLitres').textContent =
    (amt > 0 && rate) ? (amt / rate).toFixed(2) + ' L' : '—';
}

// ─────────────────────────────────────────
// GENERATE & PRINT
// ─────────────────────────────────────────
function getForm() {
  const ci  = document.getElementById('fCompany').value;
  const f   = document.getElementById('fFuel').value;
  const amt = parseFloat(document.getElementById('fAmount').value) || 0;
  return {
    indentNo: String(counter).padStart(4,'0'),
    date    : todayISO(),
    company : ci !== '' ? companies[parseInt(ci)].name : '',
    driver  : document.getElementById('fDriver').value,
    vehicle : document.getElementById('fVehicle').value,
    station : document.getElementById('fStation').value,
    fuel    : f,
    auth    : document.getElementById('fAuth').value,
    amt
  };
}

function validate(d) {
  const e = document.getElementById('errMsg');
  const checks = [
    [!d.company, 'Select a company.'],
    [!d.driver,  'Select driver name.'],
    [!d.vehicle, 'Select vehicle number.'],
    [!d.station, 'Select petrol bunk / station.'],
    [!d.fuel,    'Select fuel type.'],
    [!d.auth,    'Select authorized by.'],
    [!d.amt,     'Enter amount.'],
  ];
  for (const [fail, msg] of checks) { if (fail) { e.textContent = msg; return false; } }
  e.textContent = ''; return true;
}

function fmtDate(s) {
  if (!s) return '';
  const [y,m,d] = s.split('-');
  return d + '-' + ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+m-1] + '-' + y;
}

function buildPrint(d) {
  const row = (l,v) => `<div class="p-row"><span>${l}</span><span class="p-val">${v}</span></div>`;
  return `
  <div class="p-center p-big">FUEL INDENT</div>
  <div class="p-center p-sm">${d.company}</div>
  <div class="p-dbl"></div>
  ${row('Indent No:', d.indentNo)}
  ${row('Date:', fmtDate(d.date))}
  <div class="p-line"></div>
  ${row('Driver:',  d.driver)}
  ${row('Vehicle:', d.vehicle)}
  ${row('Station:', d.station)}
  ${row('Fuel:',    d.fuel)}
  <div class="p-line"></div>
  ${row('IOC Rate/L:', '&#x20B9;' + d.rate.toFixed(2))}
  ${row('Litres:',     d.litres.toFixed(2) + ' L')}
  <div class="p-dbl"></div>
  ${row('AMOUNT:', '&#x20B9;' + d.amt.toFixed(2))}
  <div class="p-dbl"></div>
  <div class="p-gap"></div>`;
}

function generateIndent() {
  const d = getForm();
  if (!validate(d)) return;
  // push with amount stored as d.amount for table display
  records.push({ ...d, amount: d.amt });
  localStorage.setItem('fi_records', JSON.stringify(records));
  counter++;
  localStorage.setItem('fi_counter', String(counter));
  updateIndentNo();
  renderTable();
  document.getElementById('printArea').innerHTML = buildPrint(d);
  setTimeout(() => window.print(), 200);
}

function resetForm() {
  document.getElementById('fCompany').value = '';
  document.getElementById('fAmount').value  = '';
  document.getElementById('errMsg').textContent = '';
  onCompanyChange();
}

// ─────────────────────────────────────────
// RECORDS TABLE
// ─────────────────────────────────────────
function renderTable() {
  const body = document.getElementById('recBody');
  document.getElementById('recCount').textContent = records.length + ' record(s)';
  if (!records.length) {
    body.innerHTML = '<tr><td colspan="11" class="empty">No records yet.</td></tr>';
    return;
  }
  body.innerHTML = records.slice().map(r => `
    <tr>
      <td>${r.indentNo}</td>
      <td>${fmtDate(r.date)}</td>
      <td>${r.company}</td>
      <td>${r.driver}</td>
      <td><b>${r.vehicle}</b></td>
      <td>${r.station}</td>
      <td>${r.fuel}</td>
      <td>&#x20B9;${(r.rate||0).toFixed(2)}</td>
      <td>${(r.litres||0).toFixed(2)} L</td>
      <td>&#x20B9;${(r.amount||0).toFixed(2)}</td>
      <td>${r.auth}</td>
    </tr>`).join('');
}

// ─── FIXED: clear records properly ───
function doClearRecords() {
  records = [];
  counter = 1;
  localStorage.setItem('fi_records', JSON.stringify(records));
  localStorage.setItem('fi_counter', String(counter));
  updateIndentNo();
  renderTable();
}

// ─────────────────────────────────────────
// EXPORT EXCEL
// ─────────────────────────────────────────
function exportExcel() {
  if (!records.length) { alert('No records to export.'); return; }
  const rows = [
    ['Indent No','Date','Company','Driver','Vehicle','Station','Fuel','Rate/L (₹)','Litres','Amount (₹)','Auth By'],
    ...records.map(r => [r.indentNo, r.date, r.company, r.driver, r.vehicle, r.station, r.fuel, r.rate, r.litres, r.amount, r.auth])
  ];
  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws['!cols'] = [12,12,18,18,16,24,8,10,8,12,18].map(w=>({wch:w}));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Fuel Indents');
  XLSX.writeFile(wb, 'FuelIndents_' + todayISO() + '.xlsx');
}

// ─────────────────────────────────────────
// SETTINGS
// ─────────────────────────────────────────
function renderSettings() {
  const cont = document.getElementById('settingsContainer');
  cont.innerHTML = '';
  companies.forEach((c, ci) => {
    const div = document.createElement('div');
    div.className = 'settings-card';
    div.innerHTML = `
      <h3>Company ${ci+1}</h3>
      <input class="co-name-input" id="co_name_${ci}" value="${esc(c.name)}" placeholder="Company Name">
      ${mkEditor(ci,'drivers',    'Drivers')}
      ${mkEditor(ci,'vehicles',   'Vehicle Numbers')}
      ${mkEditor(ci,'stations',   'Petrol Bunks / Stations')}
      ${mkEditor(ci,'authorizers','Authorized By')}`;
    cont.appendChild(div);
  });
}

function mkEditor(ci, key, label) {
  const rows = companies[ci][key].map((v,ii) => `
    <div class="list-item">
      <input type="text" value="${esc(v)}" id="li_${ci}_${key}_${ii}">
      <button onclick="removeItem(${ci},'${key}',${ii})">✕</button>
    </div>`).join('');
  return `
    <div style="margin-bottom:10px;">
      <div style="font-size:11px;font-weight:bold;text-transform:uppercase;color:#555;margin-bottom:4px;">${label}</div>
      <div class="list-editor" id="list_${ci}_${key}">${rows}</div>
      <button class="add-btn" onclick="addItem(${ci},'${key}')">+ Add</button>
    </div>`;
}

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
function addItem(ci,key){ companies[ci][key].push(''); renderSettings(); }
function removeItem(ci,key,ii){ companies[ci][key].splice(ii,1); renderSettings(); }

function saveSettings() {
  companies.forEach((c,ci) => {
    c.name = (document.getElementById('co_name_'+ci).value||'').trim() || c.name;
    ['drivers','vehicles','stations','authorizers'].forEach(key => {
      c[key] = Array.from(document.getElementById('list_'+ci+'_'+key)
        .querySelectorAll('input[type="text"]'))
        .map(i=>i.value.trim()).filter(v=>v!=='');
    });
  });
  localStorage.setItem('fi_companies', JSON.stringify(companies));
  populateCompanies();
  document.getElementById('settingsMsg').textContent = '✓ Settings saved.';
  setTimeout(()=>document.getElementById('settingsMsg').textContent='', 3000);
  renderSettings();
}

// ─────────────────────────────────────────
// TABS
// ─────────────────────────────────────────
function showTab(name) {
  const names = ['indent','records','settings'];
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active', names[i]===name));
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  if (name==='records')  renderTable();
  if (name==='settings') renderSettings();
}

// ─────────────────────────────────────────
// PASSWORD MODAL
// ─────────────────────────────────────────
let _pwTarget = null;

function requireAdmin(target) {
  _pwTarget = target;
  document.getElementById('pwTitle').textContent =
    target === 'clearRecords' ? 'Admin: Clear All Records' : 'Admin: Settings';
  document.getElementById('pwInput').value = '';
  document.getElementById('pwErr').textContent = '';
  document.getElementById('pwModal').classList.add('show');
  setTimeout(()=>document.getElementById('pwInput').focus(), 120);
}

function pwCancel() {
  document.getElementById('pwModal').classList.remove('show');
  _pwTarget = null;
}

function pwSubmit() {
  const val = document.getElementById('pwInput').value;
  if (val !== ADMIN_PASS) {
    document.getElementById('pwErr').textContent = 'Incorrect password.';
    document.getElementById('pwInput').value = '';
    document.getElementById('pwInput').focus();
    return;
  }
  document.getElementById('pwModal').classList.remove('show');

  const target = _pwTarget;   // capture before clearing
  _pwTarget = null;

  if (target === 'settings') {
    showTab('settings');
  } else if (target === 'clearRecords') {
    if (confirm('Delete ALL indent records permanently? This cannot be undone.')) {
      doClearRecords();
    }
  }
}
</script>
